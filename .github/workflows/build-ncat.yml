name: Compile Static Ncat

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-static-windows:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente de Nmap
      uses: actions/checkout@v4
      with:
        repository: nmap/nmap
        ref: master

    - name: Instalar MinGW y dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 make autoconf

    - name: Configurar entorno para compilación estática
      run: |
        ./configure --host=x86_64-w64-mingw32 \
          --without-openssl \
          --without-libpcap \
          --without-liblua \
          --without-libssh2 \
          --without-libz \
          --without-zenmap \
          --without-ndiff \
          --without-nping \
          --without-nmap-update \
          CFLAGS="-static -static-libgcc" \
          CXXFLAGS="-static -static-libgcc -static-libstdc++" \
          LDFLAGS="-static -static-libgcc -static-libstdc++"

    - name: Compilar dependencias y Ncat
      run: |
        make -C nbase
        make -C nsock/src
        make -C ncat LDFLAGS="-static -static-libgcc -static-libstdc++" LIBS="-lws2_32 -liphlpapi -lwsock32"

    - name: Reducir tamaño
      run: x86_64-w64-mingw32-strip ncat/ncat.exe

    - name: Guardar artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ncat-static-windows-x64
        path: ncat/ncat.exe